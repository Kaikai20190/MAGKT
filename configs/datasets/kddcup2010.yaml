# generated by step1_prepare_data.py
# C = 112 concepts; H has 2Q x 2C = 2168 x 224 entries
# model/train/max_len: selected on the validation learners by step3_tune.py
data:
  root: data/processed
  name: kddcup2010
  train_file: kddcup2010/kddcup2010_train.txt
  test_file: kddcup2010/kddcup2010_test.txt
  hypergraph_file: H/kddcup2010.csv
  num_questions: 1084
  n_lines: 5
  q_line: 1
  a_line: 3
  t_line: 4
  qid_offset: 1
  invalid_qid: error
  c_line: 2
  max_len: 200
model:
  kc_input: true
  kc_head: true
  head_type: dot
train:
  weight_decay: 1.0e-05
  grad_clip: 1.0
  id_weight_decay: 0.01
