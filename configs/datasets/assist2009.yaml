# generated by step1_prepare_data.py
# C = 123 concepts; H has 2Q x 2C = 35474 x 246 entries
# model/train/max_len: selected on the validation learners by step3_tune.py
data:
  root: data/processed
  name: assist2009
  train_file: assist2009/assist2009_train.txt
  test_file: assist2009/assist2009_test.txt
  hypergraph_file: H/assist2009.csv
  num_questions: 17737
  n_lines: 4
  q_line: 1
  a_line: 3
  t_line: null
  qid_offset: 1
  invalid_qid: error
  c_line: 2
  max_len: 50
model:
  kc_input: true
  kc_head: true
  head_type: dot
train:
  weight_decay: 1.0e-05
  grad_clip: 1.0
  id_weight_decay: 0.001
