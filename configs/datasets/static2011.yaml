# generated by step1_prepare_data.py
# C = 85 concepts; H has 2Q x 2C = 2448 x 170 entries
# model/train/max_len: selected on the validation learners by step3_tune.py
data:
  root: data/processed
  name: static2011
  train_file: static2011/static2011_train.txt
  test_file: static2011/static2011_test.txt
  hypergraph_file: H/static2011.csv
  num_questions: 1224
  n_lines: 5
  q_line: 1
  a_line: 3
  t_line: 4
  qid_offset: 1
  invalid_qid: error
  c_line: 2
  max_len: 100
model:
  kc_input: true
  kc_head: true
  head_type: mlp
train:
  weight_decay: 1.0e-05
  id_weight_decay: 0.01
